name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"

      # caches dependencies, build cache and configuration cache; PRs only read it
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build, test & lint (PR, arm64-v8a)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug -PabiFilter=arm64-v8a --stacktrace

      - name: Build, test & lint (main, all ABIs)
        if: github.event_name != 'pull_request'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: VireoAirTV-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
