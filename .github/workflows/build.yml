name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build & Lint (PR, arm64-v8a)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug lintDebug -PabiFilter=arm64-v8a --stacktrace

      - name: Build (main, all ABIs)
        if: github.event_name != 'pull_request'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: VireoAirTV-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
